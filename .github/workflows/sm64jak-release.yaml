name: "Cut SM64-Jak Release"

# OpenGOAL Mod Launcher-compatible release, modeled on
# OpenGOAL-Mods/OG-Mod-Base's mod-release-pipeline: produces a
# windows-vX.Y.Z.zip (gk.exe entry point + data/ layout) and metadata.json.
# The zip additionally carries the sm64-jak source + Setup.bat so testers
# build the SM64 half from their own ROM — no game data ships in the asset.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver Bump Type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  create_release:
    name: "Create Release"
    runs-on: ubuntu-latest
    outputs:
      tagName: ${{ steps.tag_version.outputs.new_tag }}
    steps:
      - name: Bump Version and Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # distinct prefix: the fork inherits upstream jak-project tags whose
          # commits share no ancestry with this branch (tag action chokes)
          tag_prefix: sm64jak-v
          default_bump: ${{ inputs.bump }}
          release_branches: "master,main,64-jak"

      - name: Create Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ steps.tag_version.outputs.new_tag }} --generate-notes --draft --repo ${{ github.repository }}

  build_windows:
    name: "Windows Build + Bundle"
    needs: create_release
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create_release.outputs.tagName }}
          submodules: "recursive"

      # Build setup mirrors .github/workflows/windows-build-clang.yaml
      # (what jak-project / OG-Mod-Base CI use): clang-static preset +
      # sccache is far faster than a cold MSVC build, and static exes
      # need no companion-DLL co-location.
      - name: Install NASM
        run: |
          $chocoVersion = choco --version
          if ($chocoVersion.StartsWith("2.")) {
            choco install nasm --source="${{ github.workspace }}/third-party/nasm"
          } else {
            choco install ${{ github.workspace }}/third-party/nasm/old/nasm.2.15.05.nupkg
          }

      - name: Setup sccache
        uses: hendrikmuhs/ccache-action@v1.2.20
        with:
          variant: sccache
          key: windows-2022-static-sm64jak-${{ github.sha }}
          restore-keys: windows-2022-static-sm64jak
          max-size: 1000M

      - uses: ilammy/msvc-dev-cmd@v1

      # https://github.com/actions/runner-images/issues/5459
      - name: Remove Strawberry Perl from PATH
        run: |
          $env:PATH = $env:PATH -replace "C:\\Strawberry\\c\\bin;", ""
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: CMake Generation
        shell: cmd
        run: cmake -B build --preset=Release-windows-clang-static -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DBUILD_LIBJAKOPENGOAL=ON .

      - name: Build Project
        shell: cmd
        run: cmake --build build --parallel %NUMBER_OF_PROCESSORS% --target gk goalc extractor jakopengoal

      - name: Bundle (OG-Mod-Base layout + SM64-Jak extras)
        shell: bash
        run: |
          set -e
          DEST=./bundle
          # Ninja presets output to build/bin; MSVC multi-config to build/bin/Release
          BIN=build/bin
          [ -d build/bin/Release ] && BIN=build/bin/Release
          mkdir -p $DEST/data/launcher $DEST/data/decompiler $DEST/data/game/graphics/opengl_renderer $DEST/data/log

          # Binaries (static build: exes are self-contained; copy any DLLs
          # that do exist, e.g. jakopengoal.dll and shared SDL if present)
          cp $BIN/gk.exe $DEST/
          cp $BIN/goalc.exe $DEST/
          cp $BIN/extractor.exe $DEST/
          cp $BIN/*.dll $DEST/ 2>/dev/null || true

          # Official OpenGOAL data/ layout (what extractor + gk expect)
          cp .github/scripts/releases/error-code-metadata.json $DEST/data/launcher/
          cp -r decompiler/config $DEST/data/decompiler/
          cp -r goal_src $DEST/data/
          cp -r game/assets $DEST/data/game/
          cp -r game/graphics/opengl_renderer/shaders $DEST/data/game/graphics/opengl_renderer/
          cp -r custom_assets $DEST/data/

          # SM64-Jak source (CI checkout is git-clean: no ROM-derived files)
          cp -r sm64-jak $DEST/sm64-jak
          rm -rf $DEST/sm64-jak/build

          # DLLs the SM64 exe needs at runtime, staged for Setup.bat
          mkdir -p $DEST/dlls
          cp $BIN/*.dll $DEST/dlls/ 2>/dev/null || true
          cp sm64-jak/extras/gamecontrollerdb.txt $DEST/dlls/ || true
          cp controllers.txt $DEST/dlls/ || true
          # the SM64 exe dlopen's this at runtime — fail loudly if absent
          test -f $DEST/dlls/jakopengoal.dll

          # Tester-facing scripts
          cp release_files/Setup.bat $DEST/
          cp "release_files/Play SM64-Jak.bat" $DEST/
          cp release_files/README.txt $DEST/

      - name: Zip Bundle
        shell: bash
        run: |
          TAG="${{ needs.create_release.outputs.tagName }}"
          VER="${TAG#sm64jak-}"   # launcher-standard asset name: windows-vX.Y.Z.zip
          cd bundle && 7z a -tzip "../windows-$VER.zip" ./* && cd ..
          ls -la windows-*.zip

      - name: Emit metadata.json
        shell: bash
        run: |
          TAG="${{ needs.create_release.outputs.tagName }}"
          cat > metadata.json <<EOF
          {
            "schemaVersion": "0.1.0",
            "version": "${TAG#sm64jak-v}",
            "supportedGames": ["jak1"],
            "publishedDate": "$(date -u +%Y-%m-%dT%H:%M:%S)"
          }
          EOF
          cat metadata.json

      - name: Upload Assets + Publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create_release.outputs.tagName }}"
          VER="${TAG#sm64jak-}"
          gh release upload "$TAG" "./windows-$VER.zip" metadata.json --repo ${{ github.repository }} --clobber
          gh release edit "$TAG" --draft=false --repo ${{ github.repository }}

  # Releases created with GITHUB_TOKEN don't fire `release` events, so the
  # testing mod-list update is chained here instead of event-triggered.
  update_mod_list:
    name: "Update Mod List"
    needs:
      - create_release
      - build_windows
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: 64-jak

      - name: "Update mod_list.json"
        env:
          VERSION: ${{ needs.create_release.outputs.tagName }}
          SUPPORTED_GAMES: "jak1"
        run: python ./.github/scripts/create-mod-release/update-mod-list.py

      - name: "Commit and Push"
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add mod_list.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update mod_list.json for ${{ needs.create_release.outputs.tagName }}"
          git push
