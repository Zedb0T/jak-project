name: "Update SM64-Jak Mod List 📋"

# Regenerates mod_list.json (the OpenGOAL launcher testing mod-source) from a
# release and commits it to 64-jak. Runs automatically at the end of the
# release pipeline (releases created with GITHUB_TOKEN can't trigger `release`
# events, so the release workflow calls this job directly) — this standalone
# workflow is for manual/backfill runs.
# Launcher source URL:
#   https://raw.githubusercontent.com/Zedb0T/jak-project/64-jak/mod_list.json

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. sm64jak-v0.0.3). Leave empty to use the latest release."
        required: false
        type: string

permissions:
  contents: write

jobs:
  update_mod_list:
    name: "Update Mod List"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          ref: 64-jak

      - name: "Resolve Version"
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            LATEST=$(gh release view --repo ${{ github.repository }} --json tagName -q '.tagName')
            echo "VERSION=$LATEST" >> $GITHUB_OUTPUT
          fi

      - name: "Update mod_list.json"
        env:
          VERSION: ${{ steps.resolve.outputs.VERSION }}
          SUPPORTED_GAMES: "jak1"
        run: python ./.github/scripts/create-mod-release/update-mod-list.py

      - name: "Commit and Push"
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add mod_list.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update mod_list.json for ${{ steps.resolve.outputs.VERSION }}"
          git push
